<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hadron">
  <!-- A hadron: three quarks (R/G/B color charge) bound by gluons inside a confinement boundary -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#30363d" stroke-width="2"/>
  <g stroke="#8b949e" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="18" x2="20" y2="42"/>
    <line x1="20" y1="42" x2="44" y2="42"/>
    <line x1="44" y1="42" x2="32" y2="18"/>
  </g>
  <circle cx="32" cy="18" r="7" fill="#f85149"/>
  <circle cx="20" cy="42" r="7" fill="#3fb950"/>
  <circle cx="44" cy="42" r="7" fill="#58a6ff"/>
</svg>
