name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm test boots a throwaway server + real tmux sessions (test-security),
      # so tmux is a hard dependency even in CI.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm install
      - run: npm test
